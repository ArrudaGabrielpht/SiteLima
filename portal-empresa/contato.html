<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AURON - Contato</title>

    <style>
        body {
            font-family: Arial;
            background-color: #111;
            color: white;
            margin: 20px;
        }

        nav {
            background-color: #222;
            padding: 10px;
        }

        nav a {
            color: white;
            margin: 10px;
        }

        h1, h2 {
            color: orangered;
        }

        img {
            max-width: 100%;
        }

        footer {
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Contato</h1>

        <p>Mais que esporte, é você.</p>
    </header>

    <nav>
        <a href="index.html">Início</a> |
        <a href="sobre.html">Sobre nós</a> |
        <a href="servicos.html">Produtos</a> |
        <a href="contato.html">Contato</a>
    </nav>

    <main>

        <section>

            <h2>Fale com a AURON</h2>

            <p>
                Preencha o formulário abaixo para entrar
                em contato conosco.
            </p>

            <form>

                <label for="nome">Nome:</label>

                <input type="text"
                       id="nome"
                       name="nome"
                       placeholder="Digite seu nome"
                       required>

                <br><br>

                <label for="email">E-mail:</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Digite seu e-mail"
                       required>

                <br><br>

                <label for="assunto">Assunto:</label>

                <input type="text"
                       id="assunto"
                       name="assunto"
                       placeholder="Digite o assunto"
                       required>

                <br><br>

                <label for="mensagem">Mensagem:</label>

                <br>

                <textarea id="mensagem"
                          name="mensagem"
                          placeholder="Digite sua mensagem"
                          required></textarea>

                <br><br>

                <button type="submit">Enviar</button>

            </form>

        </section>

        <aside>

            <h2>Outros contatos</h2>

            <p>E-mail: contato@auron.com.br</p>

            <p>Telefone: (11) 99999-9999</p>

        </aside>

    </main>

    <footer>
        <p>&copy; 2026 AURON - Mais que esporte, é você.</p>
    </footer>

</body>

</html>
